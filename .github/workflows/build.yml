name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Gradium's Phonon runtime, pinned to the commit this app was written against.
  UPSTREAM_REPO: gradium-ai/xn-ptts
  UPSTREAM_REF: e5110afd3ead725c940b6411eec4985fb8b111aa
  # The model and voices, kept as an asset of a release in this repo (too big for git).
  MODEL_PACK_TAG: model-pack
  MODEL_PACK_ASSET: phonon-40m-multilingual-pack.zip

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Phonon runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      # .cargo/config.toml pins target-cpu=native, which would make cached host tools crash on a
      # runner with another CPU (xn-ptts's own CI removes it too). Then this app's small patches.
      - name: Prepare the runtime
        run: |
          rm -f upstream/.cargo/config.toml
          for p in patches/*.patch; do git -C upstream apply --verbose "$GITHUB_WORKSPACE/$p"; done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream -> target
          cache-all-crates: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Download the model pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MODEL_PACK_TAG" -R "$GITHUB_REPOSITORY" -p "$MODEL_PACK_ASSET" -D pack
          unzip -q "pack/$MODEL_PACK_ASSET" -d pack/full

      - name: Build the host tools (quantizer and ptts command line)
        working-directory: upstream
        run: cargo build --release -p ptts --features cli --bin ptts --example quantize

      - name: Quantize the weights to q8_0 for phones
        run: |
          upstream/target/release/examples/quantize pack/full/model.safetensors pack/model.q8.gguf --quant q8_0 --no-mimi-encoder | tail -3
          ls -la pack/model.q8.gguf

      # Synthesis is checked here; the audio stays on the runner and is never published.
      - name: Smoke test both weight formats and pick one
        id: weights
        run: |
          set +e
          mk() { mkdir -p "$1"; cp pack/full/config.json pack/full/tokenizer.json "$1/"; cp -r pack/full/voices "$1/"; }
          mk pack/q8; cp pack/model.q8.gguf pack/q8/
          mk pack/st; cp pack/full/model.safetensors pack/st/
          OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT"
          PTTS=upstream/target/release/ptts
          PT="Olá! Este é um teste rápido do motor de voz."
          EN="Hello, this is a quick test of the speech engine."
          ok_q8=0; ok_st=0
          for v in Davi Rafaela; do
            $PTTS -m pack/q8 --quant q8_0 --device cpu -t 0.8 --lang pt -v "$v" -o "$OUT/q8-$v.wav" "$PT" || ok_q8=1
          done
          $PTTS -m pack/q8 --quant q8_0 --device cpu -t 0.8 --lang en -v Freya -o "$OUT/q8-Freya.wav" "$EN" || ok_q8=1
          $PTTS -m pack/q8 --quant q8_0 --quantize-mimi --device cpu -t 0.8 --lang pt -v Davi -o "$OUT/q8-mimi8.wav" "$PT" \
            || echo "::warning::the q8_0 Mimi decoder failed on the host; the app's option may not work"
          $PTTS -m pack/st --device cpu -t 0.8 --lang pt -v Davi -o "$OUT/f32-Davi.wav" "$PT" || ok_st=1
          ls -la "$OUT"; rm -rf "$OUT"
          if [ $ok_q8 = 0 ]; then echo "weights=q8" >> "$GITHUB_OUTPUT";
          elif [ $ok_st = 0 ]; then echo "weights=st" >> "$GITHUB_OUTPUT"; echo "::warning::q8 failed, shipping safetensors";
          else echo "::error::neither weight format synthesizes"; exit 1; fi

      - name: Build the Android native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/build-native.sh upstream android/jniLibs

      - name: Put the model into the APK assets
        run: |
          W="${{ steps.weights.outputs.weights }}"
          D=android/model-assets/model
          rm -rf android/model-assets; mkdir -p "$D"
          cp -r "pack/$W/." "$D/"
          echo "$(sha256sum "pack/$MODEL_PACK_ASSET" | cut -c1-16)-$W-${UPSTREAM_REF:0:12}" > "$D/PACK_VERSION"
          cat "$D/PACK_VERSION"; du -sh "$D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret: the APK is signed with a throwaway debug key"
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION_NAME="${GITHUB_REF_NAME#v}";
          else export APP_VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          gradle -p android --no-daemon assembleRelease
          mkdir -p out
          cp android/build/outputs/apk/release/*.apk "out/phonon-android-${APP_VERSION_NAME}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phonon-android-apk
          path: out/*.apk
          compression-level: 0

      - name: Publish a release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "Download the .apk below and install it on your phone." > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          gh release create "$GITHUB_REF_NAME" out/*.apk -R "$GITHUB_REPOSITORY" \
            --title "Phonon for Android $GITHUB_REF_NAME" --notes-file "$NOTES"
