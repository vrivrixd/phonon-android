name: Build APK

on:
  push:
    branches: [main]
  # A build with a release's version number, to test before publishing it.
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, such as 1.2.0 (empty for a dev build)"
        required: false
        type: string
      version_code:
        description: "Version code (empty for the run number)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Gradium's Phonon runtime, pinned to the commit this app was written against.
  UPSTREAM_REPO: gradium-ai/xn-ptts
  UPSTREAM_REF: e5110afd3ead725c940b6411eec4985fb8b111aa
  # The model and voices, kept as an asset of a release of the main repository (too big for git).
  # Named outright so forks, which lack that release, build too.
  MODEL_PACK_REPO: vrivrixd/phonon-android
  MODEL_PACK_TAG: model-pack
  MODEL_PACK_ASSET: phonon-40m-multilingual-pack.zip

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Voices contributed for this app only, kept in a private repository (licenses/CONTRIBUTED-VOICES.txt).
      # Forks get no secrets, so they build without them.
      HAS_VOICES_KEY: ${{ secrets.VOICES_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # First, so a broken change fails in minutes rather than after the native build.
      - name: Run the unit tests
        run: gradle -p android --no-daemon testReleaseUnitTest

      - name: Check out the Phonon runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      # .cargo/config.toml pins target-cpu=native, which would make cached host tools crash on a
      # runner with another CPU (xn-ptts's own CI removes it too). Then any patches in patches/.
      - name: Prepare the runtime
        run: |
          rm -f upstream/.cargo/config.toml
          shopt -s nullglob
          for p in patches/*.patch; do git -C upstream apply --verbose "$GITHUB_WORKSPACE/$p"; done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream -> target
          cache-all-crates: true

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked

      - name: Download the model pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MODEL_PACK_TAG" -R "$MODEL_PACK_REPO" -p "$MODEL_PACK_ASSET" -D pack
          unzip -q "pack/$MODEL_PACK_ASSET" -d pack/full

      - name: Check out the contributed voices
        if: env.HAS_VOICES_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: vrivrixd/phonon-voices
          ssh-key: ${{ secrets.VOICES_DEPLOY_KEY }}
          path: contributed

      - name: Add the contributed voices to the model's voices
        if: env.HAS_VOICES_KEY == 'true'
        run: |
          for f in contributed/voices/*.safetensors; do
            if [ -e "pack/full/voices/$(basename "$f")" ]; then echo "::error::$(basename "$f") is already a catalog voice"; exit 1; fi
            cp "$f" pack/full/voices/
          done
          ls contributed/voices

      - name: Build the ptts command line
        working-directory: upstream
        run: cargo build --release -p ptts --features cli --bin ptts

      # The app ships the full-precision weights: the compact q8_0 ones sounded different from the
      # computer's. Synthesis is checked here; the audio stays on the runner and is never published.
      - name: Smoke test
        run: |
          mkdir -p pack/st; cp pack/full/config.json pack/full/tokenizer.json pack/full/model.safetensors pack/st/; cp -r pack/full/voices pack/st/
          OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT"
          PTTS=upstream/target/release/ptts
          PT="Olá! Este é um teste rápido do motor de voz."
          EN="Hello, this is a quick test of the speech engine."
          ok=0
          for v in Davi Rafaela; do $PTTS -m pack/st --device cpu -t 0.8 --lang pt -v "$v" -o "$OUT/$v.wav" "$PT" || ok=1; done
          $PTTS -m pack/st --device cpu -t 0.8 --lang en -v Freya -o "$OUT/Freya.wav" "$EN" || ok=1
          for f in contributed/voices/*.safetensors; do
            [ -e "$f" ] || continue
            $PTTS -m pack/st --device cpu -t 0.8 --lang pt -v "$(basename "$f" .safetensors)" -o "$OUT/c-$(basename "$f" .safetensors).wav" "$PT" || ok=1
          done
          ls -la "$OUT"; rm -rf "$OUT"
          if [ $ok != 0 ]; then echo "::error::a voice does not synthesize"; exit 1; fi

      - name: Build the Android native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/build-native.sh upstream android/jniLibs

      - name: Put the model into the APK assets
        run: |
          W=st
          D=android/model-assets/model
          rm -rf android/model-assets; mkdir -p "$D"
          cp -r "pack/$W/." "$D/"
          # Any change to the model, the runtime or the voices makes the app copy the model out again.
          VOICES=$( (ls "$D/voices"; cat "$D"/voices/*.safetensors) | sha256sum | cut -c1-12)
          echo "$(sha256sum "pack/$MODEL_PACK_ASSET" | cut -c1-16)-$W-${UPSTREAM_REF:0:12}-$VOICES" > "$D/PACK_VERSION"
          cat "$D/PACK_VERSION"; du -sh "$D"
          if [ -d contributed ]; then
            cp contributed/voices.json android/model-assets/contributed-voices.json
            cp contributed/LICENSE android/model-assets/contributed-voices-license.txt
          fi

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret: the APK is signed with a throwaway debug key"
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          export APP_VERSION_NAME="${INPUT_VERSION:-0.0.${GITHUB_RUN_NUMBER}-dev}"
          gradle -p android --no-daemon assembleRelease
          mkdir -p out
          cp android/build/outputs/apk/release/*.apk "out/phonon-${APP_VERSION_NAME}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: phonon-apk
          path: out/*.apk
          compression-level: 0
